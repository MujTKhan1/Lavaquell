<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <!-- Illustrative hospitality setting: brass-rimmed tray with a tumbler. -->
  <defs>
    <linearGradient id="trayTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7eef1"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b48a4e"/>
      <stop offset="0.5" stop-color="#e6c88f"/>
      <stop offset="1" stop-color="#a77d43"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6ee" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#bcd9e3" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <ellipse cx="320" cy="214" rx="300" ry="20" fill="#0b1f4d" opacity="0.1"/>
  <ellipse cx="320" cy="186" rx="290" ry="40" fill="url(#brass)"/>
  <ellipse cx="320" cy="178" rx="276" ry="34" fill="url(#trayTop)"/>
  <!-- tumbler -->
  <path d="M470 70 H540 L532 168 C530 176 480 176 478 168 Z" fill="url(#glassG)" stroke="#9cbfcc" stroke-width="2.5"/>
  <path d="M476 120 H534 L531 166 C529 172 481 172 479 166 Z" fill="#bfe3ee" opacity="0.55"/>
  <path d="M488 82 V156 M500 82 V158 M512 82 V158 M524 82 V156" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <ellipse cx="505" cy="70" rx="35" ry="6" stroke="#9cbfcc" stroke-width="2.5" fill="none"/>
</svg>
